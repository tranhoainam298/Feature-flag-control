      - Organizations
      summary: Lấy chi tiết organization
      operationId: get_organization_api_v1_organizations__org_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      responses:
        '200':
          description: Successful Response
