[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-scanner"
version = "0.1.0"
description = "FlagOps Codebase Feature Flag Scanner CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
flag-scanner = "flag_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flag_scanner*"]
