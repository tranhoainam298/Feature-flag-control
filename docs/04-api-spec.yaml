  /api/v1/projects/{project_id}/flags:
    get:
      tags:
      - Flags
      summary: Danh sách flag trong project (lọc theo tag, type, archived, search)
      operationId: list_flags_api_v1_projects__project_id__flags_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo tag
          title: Tag
        description: Lọc theo tag
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FlagType'
          - type: 'null'
          description: Lọc theo kiểu flag
          title: Type
        description: Lọc theo kiểu flag
      - name: archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Lọc cờ lưu trữ
          title: Archived
        description: Lọc cờ lưu trữ
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Tìm kiếm theo key hoặc tên
          title: Search
        description: Tìm kiếm theo key hoặc tên
