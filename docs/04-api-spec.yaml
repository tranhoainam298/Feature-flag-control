        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Org Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
